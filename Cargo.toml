[workspace]
resolver = "3"
members = [
  "tano",
  "tano-backend",
  "tano-config",
  "tano-database",
  "tano-macro",
  "tano-providers",
  "tano-shared",
  "tano-tui",
  "tano-watcher",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
license = "MIT"
authors = ["Lucas Gager <evest.dev@gmail.com>"]
homepage = "https://github.com/Ev357/tano"
repository = "https://github.com/Ev357/tano"
rust-version = "1.100.0"

[profile.release]
codegen-units = 1
lto = true
strip = true
