[package]
name = "tano-database"
version = "0.1.0"
edition = "2024"

[dependencies]
tano-shared = { path = "../tano-shared", version = "0.1.0" }
color-eyre = "0.6.5"
tokio = { version = "1.52.3", features = ["full"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "uuid"] }
tano-macro = { path = "../tano-macro", version = "0.1.0" }
tano-providers = { path = "../tano-providers", version = "0.1.0" }
