[package]
name = "tano"
version = "0.1.0"
edition = "2024"

[dependencies]
tano-config = { path = "../tano-config", version = "0.1.0" }
tano-database = { path = "../tano-database", version = "0.1.0" }
tano-tui = { path = "../tano-tui", version = "0.1.0" }
tano-backend = { path = "../tano-backend", version = "0.1.0" }
tano-watcher = { path = "../tano-watcher", version = "0.1.0" }
tano-shared = { path = "../tano-shared", version = "0.1.0" }
tano-macro = { path = "../tano-macro", version = "0.1.0" }
tano-providers = { path = "../tano-providers", version = "0.1.0" }
color-eyre = "0.6.5"
tokio = { version = "1.52.3", features = ["full"] }
crossterm = "0.29.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-error = "0.2.1"
